name: samvaad
description: "Samvaad — an accessible-first communication platform for calls, chat, and community."
publish_to: 'none'
version: 1.0.0+1 # 1.0.0 is the version users see; +1 is the build number, which must increase on every single upload to the Play Store

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  firebase_core: ^4.14.0
  firebase_core_platform_interface: ^8.1.1
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  livekit_client: ^2.13.0
  cloud_functions: ^6.5.0
  permission_handler: ^13.0.2
  speech_to_text: ^7.5.0
  firebase_ai: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true

dependency_overrides:
  meta: ^1.18.3
  test_api: ^0.7.13
  analyzer: ^13.3.0
  test: ^1.31.2
  dart_style: ^3.1.12

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F5257"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter_native_splash:
  color: "#10151A"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#10151A"
    image: assets/icon/icon_foreground.png
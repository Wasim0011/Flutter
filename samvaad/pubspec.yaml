name: samvaad
description: "Samvaad — an accessible-first communication platform for calls, chat, and community."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8

flutter:
  uses-material-design: true

# Forces a known-good, mutually-compatible combination of these five
# packages across the whole dependency graph. Needed right now because
# analyzer 13.x is mid-rollout across the ecosystem — different packages
# (build_runner, riverpod_generator, test, dart_style) each declare their
# own analyzer-adjacent constraints, and they don't all converge to the
# same resolution without an explicit nudge. Revisit/remove this block
# once the packages above catch up to each other's constraint ranges
# (check periodically with `flutter pub outdated`).
dependency_overrides:
  meta: ^1.18.3
  test_api: ^0.7.13
  analyzer: ^13.3.0
  test: ^1.31.2
  dart_style: ^3.1.12
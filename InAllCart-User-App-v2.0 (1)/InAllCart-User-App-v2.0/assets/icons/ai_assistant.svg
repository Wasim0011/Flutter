<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bagGradient" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
<stop stop-color="#6C63FF"/>
<stop offset="1" stop-color="#00BFA6"/>
</linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="5" result="blur"/>
<feComposite in="SourceGraphic" in2="blur" operator="over"/>
</filter>
</defs>

<!-- Floating Sparkles -->
<path d="M165 35L170 25L175 35L185 40L175 45L170 55L165 45L155 40L165 35Z" fill="#FEC107" filter="url(#glow)">
<animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
</path>
<path d="M30 60L33 54L36 60L42 63L36 66L33 72L30 66L24 63L30 60Z" fill="#00BFA6" filter="url(#glow)">
<animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
</path>
<path d="M150 150L153 144L156 150L162 153L156 156L153 162L150 156L144 153L150 150Z" fill="#FF6584" filter="url(#glow)">
<animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
</path>

<!-- Shopping Bag Body -->
<rect x="50" y="70" width="100" height="110" rx="20" fill="url(#bagGradient)" />

<!-- Bag Handle -->
<path d="M70 70V50C70 33.4315 83.4315 20 100 20C116.569 20 130 33.4315 130 50V70" stroke="url(#bagGradient)" stroke-width="12" stroke-linecap="round"/>

<!-- Smiley Face on Bag -->
<path d="M80 110C80 110 90 120 100 120C110 120 120 110 120 110" stroke="white" stroke-width="6" stroke-linecap="round" stroke-opacity="0.8"/>
<circle cx="85" cy="95" r="5" fill="white" fill-opacity="0.8"/>
<circle cx="115" cy="95" r="5" fill="white" fill-opacity="0.8"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- House with moving truck - detailed -->
  <!-- House -->
  <rect x="4" y="30" width="28" height="22" rx="2" fill="currentColor" opacity="0.18"/>
  <polygon points="18,14 2,30 34,30" fill="currentColor" opacity="0.35"/>
  <polygon points="18,18 6,28 30,28" fill="currentColor" opacity="0.5"/>
  <rect x="14" y="36" width="8" height="12" rx="1.5" fill="currentColor" opacity="0.55"/>
  <circle cx="20" cy="42" r="0.8" fill="currentColor" opacity="0.8"/>
  <rect x="6" y="34" width="6" height="5" rx="1" fill="currentColor" opacity="0.35"/>
  <line x1="9" y1="34" x2="9" y2="39" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <line x1="6" y1="36.5" x2="12" y2="36.5" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <rect x="24" y="34" width="6" height="5" rx="1" fill="currentColor" opacity="0.35"/>
  <line x1="27" y1="34" x2="27" y2="39" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <line x1="24" y1="36.5" x2="30" y2="36.5" stroke="currentColor" stroke-width="0.6" opacity="0.2"/>
  <!-- Chimney -->
  <rect x="24" y="18" width="4" height="10" rx="1" fill="currentColor" opacity="0.3"/>

  <!-- Arrow -->
  <path d="M36 40h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M40 37l3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>

  <!-- Truck body -->
  <rect x="44" y="28" width="24" height="18" rx="2.5" fill="currentColor" opacity="0.4"/>
  <rect x="46" y="30" width="20" height="14" rx="1.5" fill="currentColor" opacity="0.15"/>
  <!-- Truck cabin -->
  <path d="M68 28h6a6 6 0 016 6v8a2 2 0 01-2 2H68V28z" fill="currentColor" opacity="0.6"/>
  <rect x="70" y="31" width="7" height="6" rx="1.5" fill="currentColor" opacity="0.25"/>
  <!-- Truck details -->
  <rect x="48" y="32" width="4" height="5" rx="0.8" fill="currentColor" opacity="0.25"/>
  <rect x="54" y="32" width="4" height="5" rx="0.8" fill="currentColor" opacity="0.25"/>
  <rect x="60" y="32" width="4" height="5" rx="0.8" fill="currentColor" opacity="0.25"/>
  <!-- Bumper -->
  <rect x="78" y="38" width="2" height="6" rx="1" fill="currentColor" opacity="0.5"/>
  <!-- Headlight -->
  <circle cx="79" cy="36" r="1.5" fill="currentColor" opacity="0.4"/>
  <!-- Wheels -->
  <circle cx="52" cy="48" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="52" cy="48" r="3" fill="currentColor" opacity="0.15"/>
  <circle cx="52" cy="48" r="1.2" fill="currentColor" opacity="0.5"/>
  <circle cx="72" cy="48" r="5" fill="currentColor" opacity="0.7"/>
  <circle cx="72" cy="48" r="3" fill="currentColor" opacity="0.15"/>
  <circle cx="72" cy="48" r="1.2" fill="currentColor" opacity="0.5"/>
  <!-- Ground line -->
  <line x1="0" y1="53" x2="80" y2="53" stroke="currentColor" stroke-width="1" opacity="0.1"/>
  <!-- Motion lines -->
  <line x1="40" y1="35" x2="43" y2="35" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
  <line x1="38" y1="38" x2="43" y2="38" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.15"/>
  <line x1="39" y1="41" x2="43" y2="41" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.2"/>
</svg>
